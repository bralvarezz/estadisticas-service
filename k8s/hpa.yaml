apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: estadisticas-service
spec:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60 
    scaleUp:
      stabilizationWindowSeconds: 0    
      
  scaleTargetRef:                 
    apiVersion: apps/v1
    kind: Deployment
    name: estadisticas-service
  minReplicas: 1                 
  maxReplicas: 6                  
  metrics:
    - type: Resource
      resource:
        name: cpu                 
        target:
          type: Utilization
          averageUtilization: 50 